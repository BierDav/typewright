[package]
name = "jj_bridge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jj-lib = { version = "0.46", default-features = false, features = ["git"] }
gix = { version = "0.88", default-features = false, features = ["sha1"] }
pollster = "1"
futures = "0.3"
blake3 = { version = "1", default-features = false, features = ["std"] }
anyhow = "1"
base64 = "0.22"
tempfile = "3"
rand_chacha = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]

[profile.release]
lto = "thin"
