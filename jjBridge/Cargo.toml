[package]
name = "jj_bridge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jj-lib = { version = "0.46", default-features = false, features = ["git"] }
gix = { version = "0.88", default-features = false, features = ["sha1"] }
pollster = "1"
futures = "0.3"
blake3 = { version = "1", default-features = false, features = ["std"] }
anyhow = "1"
base64 = "0.22"
tempfile = "3"
rand_chacha = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]

# wasm32-wasip1 (the web app): jj's file utilities and locks, gix's tempfile pids and memmap2 lack WASI support.
# The patches only add `target_os = "wasi"` code; other targets build the upstream sources unchanged.
[patch.crates-io]
jj-core = { path = "vendor/jj-core" }
jj-lib = { path = "vendor/jj-lib" }
gix-tempfile = { path = "vendor/gix-tempfile" }
memmap2 = { path = "vendor/memmap2" }

[profile.release]
lto = "thin"
