[package]
name = "iroh_bridge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
iroh = "1.3"
iroh-dns = "1.3"
iroh-blobs = { version = "0.103", default-features = false }
iroh-docs = { version = "0.101", default-features = false, features = ["metrics"] }
iroh-gossip = "0.101"
tokio = { version = "1", features = ["sync", "macros"] }
n0-future = "0.3"
bytes = "1"
url = "2.5"
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yrs = { version = "0.28.0", features = ["sync"] }
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.9"

# The browser has no file system for the stores, and no sockets for their RPC.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iroh-blobs = "0.103"
iroh-docs = "0.101"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
blake3 = { version = "1", features = ["mmap"] }

# The web app's build (`scripts/build-web-wasm.sh`); the browser reaches others through relays only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[profile.release]
lto = "thin"
