[package]
name = "iroh_bridge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
iroh = "1.3"
iroh-dns = "1.3"
iroh-blobs = "0.103"
iroh-docs = "0.101"
iroh-gossip = "0.101"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
n0-future = "0.3"
bytes = "1"
url = "2.5"
anyhow = "1"
blake3 = { version = "1", features = ["mmap"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
