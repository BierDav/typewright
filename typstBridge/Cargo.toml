[package]
name = "typst-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
typst = "=0.15.1"
typst-pdf = "=0.15.1"
typst-html = "=0.15.1"
typst-svg = "=0.15.1"
typst-layout = "=0.15.1"
typst-kit = { version = "=0.15.1", features = ["embedded-fonts", "datetime"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = { version = "0.56", default-features = false, features = ["shortcodes", "syntect-fancy"] }
pulldown-latex = "0.8"
syntect = { version = "5.3", default-features = false, features = ["html", "default-themes", "default-syntaxes", "regex-fancy"] }
# solveng's editor support, from its repository.
solveng-ide = { git = "https://github.com/BierDav/solveng", tag = "v0.2.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
typst-kit = { version = "=0.15.1", features = ["embedded-fonts", "scan-fonts", "system-packages", "system-downloader", "datetime"] }

# The web app's compiler (`scripts/build-web-wasm.sh`): files, packages and fonts come from the page.
[target.'cfg(target_arch = "wasm32")'.dependencies]
typst-ide = "=0.15.1"
ecow = "0.2"
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[profile.release]
lto = "thin"

# Local solveng while developing; replace with a tag bump above before committing.
[patch."https://github.com/BierDav/solveng"]
solveng-ide = { path = "../../solveng/editor/ide" }
