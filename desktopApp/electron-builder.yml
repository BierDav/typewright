# Installers for every platform; `scripts/build-desktopApp.sh` copies the web build into web/ first.
appId: dev.bierdav.Typewright.Desktop
productName: Typewright
copyright: Copyright © David Emanuel Bieregger
artifactName: Typewright-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - main.js
  - preload.cjs
  - package.json
  - web/**
asar: true
# The browser returns passkey sign-ins through this scheme (main.js).
protocols:
  - name: Typewright Passkey Sign-In
    schemes: [typewright-desktop]

# Made ahead by scripts/make-icon-desktopApp.sh: electron-builder's own converter needs Node.
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  # Notarizes when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set.
  notarize: true
dmg:
  title: Typewright ${version}

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false

linux:
  icon: build/icons
  category: Office
  synopsis: Write Typst with a live preview
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64]
  maintainer: David Emanuel Bieregger <ad@bos.at>
