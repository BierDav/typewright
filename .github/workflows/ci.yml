name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          xcodebuild -project Typewright.xcodeproj -scheme Typewright \
            -derivedDataPath .build CODE_SIGN_IDENTITY=- test
