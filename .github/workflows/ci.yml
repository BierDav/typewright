name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      # Same Xcode as local development, so CI compiles what we compile.
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Update solveng to its latest main
        run: scripts/update-solveng.sh
      - name: Test Rust core
        run: cargo test --manifest-path sharedCore/Cargo.toml --target-dir .build/cargo
      - name: Build and test
        run: |
          xcodebuild -project macApp/Typewright.xcodeproj -scheme Typewright \
            -derivedDataPath .build CODE_SIGN_IDENTITY=- test
