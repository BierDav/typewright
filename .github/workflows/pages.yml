name: Web App

on:
  push:
    branches: [main]
    paths:
      - webApp/**
      - sharedCore/**
      - irohBridge/**
      - typstBridge/**
      - scripts/build-web-wasm.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            sharedCore -> ../.build/cargo-wasm
            irohBridge -> ../.build/cargo-wasm
            typstBridge -> ../.build/cargo-wasm
      - name: Find wasm-bindgen version
        id: bindgen
        run: echo "version=$(grep -m1 -o 'wasm-bindgen = "=[0-9.]*"' irohBridge/Cargo.toml | grep -o '[0-9.]*[0-9]')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - name: Install binaryen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo WebAssembly/binaryen --pattern '*-x86_64-linux.tar.gz' --dir "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/binaryen"
          tar -xzf "$RUNNER_TEMP"/binaryen-*.tar.gz -C "$RUNNER_TEMP/binaryen" --strip-components 1
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"
      - name: Build Rust core and bridges for wasm
        run: scripts/build-web-wasm.sh

      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: webApp
        run: bun install --frozen-lockfile
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build
        working-directory: webApp
        env:
          TYPEWRIGHT_WEB_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          bun run check
          bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
