name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [alpha, rc, stable]
        default: alpha
      major:
        description: Major release (breaking changes)
        type: boolean
        default: false

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Calculate version
        id: version
        run: echo "version=$(scripts/next-version.sh '${{ inputs.channel }}' '${{ inputs.major }}')" >> "$GITHUB_OUTPUT"

      - name: Test
        run: xcodebuild -project macApp/Typewright.xcodeproj -scheme Typewright -derivedDataPath .build CODE_SIGN_IDENTITY=- test

      # Passkeys (and so sync) need a Developer ID signature with the associated-domains entitlement.
      - name: Import signing identity
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: |
          if [ -z "$CERTIFICATE" ] || [ -z "$PROFILE" ]; then
            echo "::warning::No signing secrets; this release can't use passkeys or sync."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/Typewright.provisionprofile"
          echo "TYPEWRIGHT_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "TYPEWRIGHT_PROVISIONING_PROFILE=$RUNNER_TEMP/Typewright.provisionprofile" >> "$GITHUB_ENV"

      - name: Build
        id: build
        env:
          TYPEWRIGHT_NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TYPEWRIGHT_NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TYPEWRIGHT_NOTARY_TEAM: ${{ secrets.NOTARY_TEAM_ID }}
        run: echo "sha=$(scripts/build-app.sh '${{ steps.version.outputs.version }}' '${{ github.run_number }}' | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flags=(--generate-notes --target "$GITHUB_SHA")
          [ "${{ inputs.channel }}" != "stable" ] && flags+=(--prerelease)
          gh release create "v$VERSION" "dist/Typewright-$VERSION.zip" --title "Typewright $VERSION" "${flags[@]}"

      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.build.outputs.sha }}
        run: |
          mkdir -p ~/.ssh
          echo "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:BierDav/homebrew-tap.git tap
          mkdir -p tap/Casks
          if [ "${{ inputs.channel }}" = "stable" ]; then
            scripts/cask.sh typewright "$VERSION" "$SHA" typewright@beta > tap/Casks/typewright.rb
          fi
          # The beta cask always tracks the newest build of any channel.
          scripts/cask.sh typewright@beta "$VERSION" "$SHA" typewright > tap/Casks/typewright@beta.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks
          git commit -m "typewright $VERSION"
          git push
