name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [alpha, rc, stable]
        default: alpha
      major:
        description: Major release (breaking changes)
        type: boolean
        default: false

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: xcode-27
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Same Xcode as local development, so CI compiles what we compile.
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Update solveng to its latest main
        run: scripts/update-solveng.sh
      - name: Calculate version
        id: version
        run: echo "version=$(scripts/next-version.sh '${{ inputs.channel }}' '${{ inputs.major }}')" >> "$GITHUB_OUTPUT"

      - name: Test
        run: xcodebuild -project macApp/Typewright.xcodeproj -scheme Typewright -derivedDataPath .build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual TYPEWRIGHT_DEBUG_ENTITLEMENTS= test

      # Passkeys (and so sync) need a Developer ID signature with the associated-domains entitlement.
      - name: Import signing identity
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: |
          # An ad-hoc build would reach Homebrew without passkeys or sync, so don't publish one.
          if [ -z "$CERTIFICATE" ] || [ -z "$PROFILE" ] || [ -z "$SIGN_IDENTITY" ]; then
            echo "::error::Missing DEVELOPER_ID_P12, PROVISIONING_PROFILE or DEVELOPER_ID_IDENTITY secrets."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/Typewright.provisionprofile"
          echo "TYPEWRIGHT_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "TYPEWRIGHT_PROVISIONING_PROFILE=$RUNNER_TEMP/Typewright.provisionprofile" >> "$GITHUB_ENV"

      - name: Build
        id: build
        env:
          TYPEWRIGHT_NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TYPEWRIGHT_NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TYPEWRIGHT_NOTARY_TEAM: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          if [ -z "$TYPEWRIGHT_NOTARY_APPLE_ID" ] || [ -z "$TYPEWRIGHT_NOTARY_PASSWORD" ] || [ -z "$TYPEWRIGHT_NOTARY_TEAM" ]; then
            echo "::error::Missing NOTARY_APPLE_ID, NOTARY_PASSWORD or NOTARY_TEAM_ID secrets; Gatekeeper blocks unnotarized casks."
            exit 1
          fi
          echo "sha=$(scripts/build-macApp.sh '${{ steps.version.outputs.version }}' '${{ github.run_number }}' | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flags=(--generate-notes --target "$GITHUB_SHA")
          [ "${{ inputs.channel }}" != "stable" ] && flags+=(--prerelease)
          gh release create "v$VERSION" "dist/Typewright-$VERSION-macos.dmg" --title "Typewright $VERSION" "${flags[@]}"

      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.build.outputs.sha }}
        run: |
          mkdir -p ~/.ssh
          echo "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:BierDav/homebrew-tap.git tap
          mkdir -p tap/Casks
          if [ "${{ inputs.channel }}" = "stable" ]; then
            scripts/cask-macApp.sh typewright "$VERSION" "$SHA" typewright@beta > tap/Casks/typewright.rb
          fi
          # The beta cask always tracks the newest build of any channel.
          scripts/cask-macApp.sh typewright@beta "$VERSION" "$SHA" typewright > tap/Casks/typewright@beta.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks
          git commit -m "typewright $VERSION"
          git push

  # The web app built once for the desktop app, served from app://typewright/ at the root.
  desktop-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            sharedCore -> ../.build/cargo-wasm
            irohBridge -> ../.build/cargo-wasm
            typstBridge -> ../.build/cargo-wasm
            jjBridge -> ../.build/cargo-wasi
      - name: Find wasm-bindgen version
        id: bindgen
        run: echo "version=$(grep -m1 -o 'wasm-bindgen = "=[0-9.]*"' irohBridge/Cargo.toml | grep -o '[0-9.]*[0-9]')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - name: Install binaryen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo WebAssembly/binaryen --pattern '*-x86_64-linux.tar.gz' --dir "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/binaryen"
          tar -xzf "$RUNNER_TEMP"/binaryen-*.tar.gz -C "$RUNNER_TEMP/binaryen" --strip-components 1
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"
      - name: Update solveng to its latest main
        run: scripts/update-solveng.sh
      - name: Build Rust core and bridges for wasm
        run: scripts/build-webApp-wasm.sh
      - uses: oven-sh/setup-bun@v2
      - name: Build
        working-directory: webApp
        env:
          TYPEWRIGHT_WEB_BASE: /
        run: |
          bun install --frozen-lockfile
          bun run --bun build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-web
          path: webApp/.output/public

  # Installers for Windows, Linux and macOS, attached to the release the Mac app created.
  desktop:
    needs: [release, desktop-web]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: desktop-web
          path: desktopApp/web
      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build
        shell: bash
        env:
          # macOS builds are signed and notarized with the Mac app's Developer ID.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.DEVELOPER_ID_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.DEVELOPER_ID_P12_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.NOTARY_APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.NOTARY_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.NOTARY_TEAM_ID || '' }}
        run: scripts/build-desktopApp.sh '${{ needs.release.outputs.version }}' --skip-web
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # Publish the PWA DMG, Windows installers, and Linux AppImages.
          # The native macOS app DMG is uploaded by the release job above.
          files=(desktopApp/dist/Typewright-*.{dmg,exe,AppImage})
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No desktop installers were produced."
            exit 1
          fi
          gh release upload "v${{ needs.release.outputs.version }}" "${files[@]}" --clobber
