[package]
name = "typst-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
typst = "=0.15.1"
typst-pdf = "=0.15.1"
typst-html = "=0.15.1"
typst-svg = "=0.15.1"
typst-layout = "=0.15.1"
typst-kit = { version = "=0.15.1", features = ["embedded-fonts", "scan-fonts", "system-packages", "system-downloader", "datetime"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = { version = "0.56", default-features = false, features = ["shortcodes", "syntect-fancy"] }
pulldown-latex = "0.8"
syntect = { version = "5.3", default-features = false, features = ["html", "default-themes", "default-syntaxes", "regex-fancy"] }

[profile.release]
lto = "thin"
